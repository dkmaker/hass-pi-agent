name: Pi Agent for Home Assistant
version: 1.0.1
slug: pi_agent
image: ghcr.io/dkmaker/hass-pi-agent/{arch}-pi_agent
description: >-
  AI coding agent with full Home Assistant access — manage automations,
  entities, dashboards, and more via natural language.
startup: services
ingress: true
ingress_port: 0
ingress_stream: true
init: false
panel_icon: mdi:robot
panel_title: Pi Agent
arch:
  - aarch64
  - amd64
homeassistant_api: true
hassio_api: true
hassio_role: admin
auth_api: true
map:
  - homeassistant_config:rw
  - all_addon_configs:rw
  - ssl:rw
  - share:rw
  - media:rw
  - backup:rw
options:
  ai:
    provider: ''
    model: ''
    api_key: ''
  install_integration: true
  additional_packages: []
  write_guard: strict
  write_guard_allow: []
schema:
  ai:
    provider: str?
    model: str?
    api_key: password?
  install_integration: bool?
  additional_packages:
    - str
  write_guard: list(strict|warn|off)?
  write_guard_allow:
    - str?
