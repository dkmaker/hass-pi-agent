configuration:
  ai:
    name: AI provider & model (managed by the app)
    description: >-
      Configured inside the Pi Agent panel — the welcome screen on first run, or
      the ⚙️ settings button later. The app lists the available provider/model
      combinations, validates the API key with a live test before saving, and
      writes the result here so it survives restarts and updates. Only edit these
      by hand as a fallback and only if you really know what you are doing:
      manual changes are NOT validated and take effect on the next restart.
    fields:
      provider:
        name: Provider
        description: >-
          Provider id, e.g. openrouter, anthropic, openai, google, groq.
      model:
        name: Model
        description: >-
          Model id for the provider, e.g. anthropic/claude-sonnet-4.5.
      api_key:
        name: API key
        description: >-
          API key for the selected provider.
  install_integration:
    name: Install Conversation Integration
    description: >-
      Automatically install the Pi Agent custom integration for
      Home Assistant Assist voice support.
  additional_packages:
    name: Additional Packages
    description: >-
      Alpine Linux packages to install at startup (e.g. jq, yq, imagemagick).
  write_guard:
    name: Write Guard
    description: >-
      Filesystem write protection: strict (configuration.yaml + its includes and
      the agent scratch dir only), warn, or off.
  write_guard_allow:
    name: Write Guard Allowlist
    description: >-
      Extra paths (globs, relative to /homeassistant) the agent is allowed to
      write to, on top of the strict defaults.
