configuration:
  ai:
    name: AI-udbyder & model (styres af appen)
    description: >-
      Konfigureres inde i Pi Agent-panelet — velkomstskærmen ved første kørsel,
      eller ⚙️-indstillingerne senere. Appen viser de tilgængelige
      udbyder/model-kombinationer, validerer API-nøglen med en live-test før den
      gemmer, og skriver resultatet her så det overlever genstart og opdatering.
      Redigér kun manuelt som nødløsning og kun hvis du præcis ved hvad du gør:
      manuelle ændringer valideres IKKE og træder først i kraft ved næste genstart.
    fields:
      provider:
        name: Udbyder
        description: >-
          Udbyder-id, fx openrouter, anthropic, openai, google, groq.
      model:
        name: Model
        description: >-
          Model-id for udbyderen, fx anthropic/claude-sonnet-4.5.
      api_key:
        name: API-nøgle
        description: >-
          API-nøgle til den valgte udbyder.
  websearch:
    name: Websøgning
    description: >-
      Websøgning for agenten, opsat inde i Pi Agent-panelet (⚙️-knappen): vælg
      en udbyder og indsæt API-nøglen — appen kører en live-test før den slår til,
      hvorefter web_search-værktøjet dukker op automatisk. Styres af appen; redigér
      kun her manuelt som nødløsning (manuelle ændringer valideres ikke og træder
      i kraft ved næste genstart).
    fields:
      enabled:
        name: Slå websøgning til
        description: >-
          Registrer web_search-værktøjet. Kræver en provider og API-nøgle nedenfor.
      provider:
        name: Provider
        description: >-
          perplexity (Perplexity API), perplexity_openrouter (Perplexity-modeller
          via OpenRouter — brug en OpenRouter-nøgle) eller brave (Brave Search API).
      api_key:
        name: API-nøgle
        description: >-
          API-nøgle til den valgte provider (Perplexity, OpenRouter eller Brave).
  install_integration:
    name: Installér samtaleintegration
    description: >-
      Installér automatisk Pi Agent-integrationen til
      Home Assistant Assist stemmesupport.
  additional_packages:
    name: Yderligere pakker
    description: >-
      Alpine Linux-pakker der installeres ved opstart (f.eks. jq, yq, imagemagick).
  write_guard:
    name: Skrivebeskyttelse
    description: >-
      Filsystem-skrivebeskyttelse: strict (kun configuration.yaml + dens includes
      og agentens scratch-mappe), warn eller off.
  write_guard_allow:
    name: Skrivebeskyttelse-undtagelser
    description: >-
      Ekstra stier (globs, relativt til /homeassistant) som agenten må skrive til,
      ud over de strikse standarder.
