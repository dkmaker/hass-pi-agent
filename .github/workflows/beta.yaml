---
name: Publish Beta

# Beta channel, driven by release-please exactly like the stable channel — just
# on the `beta` branch with pre-release versioning.
#
#   commits on `beta`  ->  release-please opens a "release X.Y.Z-beta.N" PR
#   merge that PR      ->  tag v<version> (GitHub pre-release) + bump
#                          addon-beta/config.yaml on beta
#                       -> build & push .../{arch}-pi_agent_beta:<version>
#                       -> sync the tile version onto `main` so Home Assistant
#                          offers the update (the store reads the default branch)
#
# The stable channel (release.yaml / build.yaml) is untouched.

on:
  push:
    branches:
      - beta
  workflow_dispatch:

env:
  ADDON_TARGET: addon

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          target-branch: beta
          config-file: release-please-config-beta.json
          manifest-file: .release-please-manifest-beta.json

  build:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch:
          - amd64
          - aarch64
    steps:
      - name: Checkout released beta tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync extension source into addon build context
        run: |
          rm -rf addon/extensions/home-assistant
          mkdir -p addon/extensions
          cp -a .pi/extensions/home-assistant addon/extensions/home-assistant
          rm -rf addon/extensions/home-assistant/node_modules addon/extensions/home-assistant/data

      - name: Sync webapp source into addon build context
        run: |
          rm -rf addon/webapp
          cp -a webapp addon/webapp
          rm -rf addon/webapp/node_modules addon/webapp/dist \
                 addon/webapp/.engine-agentdir addon/webapp/.engine-scratch

      - name: Point the build at the beta image name
        run: |
          sed -i 's#{arch}-pi_agent#{arch}-pi_agent_beta#' addon/config.yaml
          grep '^image:' addon/config.yaml

      - name: Build & push beta add-on image
        uses: home-assistant/builder@2026.06.0
        with:
          args: |
            --${{ matrix.arch }} \
            --target ${{ env.ADDON_TARGET }} \
            --version "${{ needs.release.outputs.version }}" \
            --no-cache

  sync-main:
    needs: [release, build]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync beta tile version onto main
        run: |
          V="${{ needs.release.outputs.version }}"
          sed -i "s/^version:.*/version: ${V}/" addon-beta/config.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add addon-beta/config.yaml
          if git diff --cached --quiet; then
            echo "Tile already at ${V}."
          else
            git commit -m "chore(beta): sync tile to ${V} [skip ci]"
            git push origin main
          fi
