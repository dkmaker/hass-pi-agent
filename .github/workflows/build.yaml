---
name: Build and Publish Add-on

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g., v0.9.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.9.0)"
        required: true
        type: string
  pull_request:
    branches:
      - main

env:
  ADDON_SLUG: pi_agent
  ADDON_TARGET: addon

jobs:
  config-sync:
    name: Beta tile config in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - run: python3 -m pip install --quiet pyyaml
      - run: python3 dev-scripts/check-beta-config.py

  build:
    name: Build ${{ matrix.arch }}
    needs: config-sync
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "version=${{ inputs.tag }}" | sed 's/version=v/version=/' >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep '^version:' addon/config.yaml | awk '{print $2}' | tr -d '\"')" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync extension source into addon build context
        run: |
          rm -rf addon/extensions/home-assistant
          mkdir -p addon/extensions
          cp -a .pi/extensions/home-assistant addon/extensions/home-assistant
          rm -rf addon/extensions/home-assistant/node_modules addon/extensions/home-assistant/data

      - name: Sync webapp source into addon build context
        run: |
          rm -rf addon/webapp
          cp -a webapp addon/webapp
          rm -rf addon/webapp/node_modules addon/webapp/dist \
                 addon/webapp/.engine-agentdir addon/webapp/.engine-scratch

      - name: Resolve build metadata
        id: meta
        run: |
          echo "from=$(grep -E "^  ${{ matrix.arch }}:" addon/build.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "name=$(grep -E '^name:' addon/config.yaml | sed 's/^name:[[:space:]]*//')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push add-on image (native ${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: addon
          file: addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          sbom: false
          no-cache: true
          tags: |
            ghcr.io/dkmaker/hass-pi-agent/${{ matrix.arch }}-pi_agent:${{ steps.version.outputs.version }}
            ghcr.io/dkmaker/hass-pi-agent/${{ matrix.arch }}-pi_agent:latest
          build-args: |
            BUILD_FROM=${{ steps.meta.outputs.from }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_NAME=${{ steps.meta.outputs.name }}
            BUILD_DESCRIPTION=Pi coding agent for Home Assistant
