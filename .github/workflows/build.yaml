---
name: Build and Publish Add-on

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g., v0.9.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.9.0)"
        required: true
        type: string
  pull_request:
    branches:
      - main

env:
  ADDON_SLUG: pi_agent
  ADDON_TARGET: addon

jobs:
  config-sync:
    name: Beta tile config in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - run: python3 -m pip install --quiet pyyaml
      - run: python3 dev-scripts/check-beta-config.py

  build:
    name: Build ${{ matrix.arch }}
    needs: config-sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch:
          - amd64
          - aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "version=${{ inputs.tag }}" | sed 's/version=v/version=/' >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep '^version:' addon/config.yaml | awk '{print $2}' | tr -d '\"')" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync extension source into addon build context
        run: |
          rm -rf addon/extensions/home-assistant
          mkdir -p addon/extensions
          cp -a .pi/extensions/home-assistant addon/extensions/home-assistant
          rm -rf addon/extensions/home-assistant/node_modules addon/extensions/home-assistant/data

      - name: Sync webapp source into addon build context
        run: |
          rm -rf addon/webapp
          cp -a webapp addon/webapp
          rm -rf addon/webapp/node_modules addon/webapp/dist \
                 addon/webapp/.engine-agentdir addon/webapp/.engine-scratch

      - name: Build add-on
        uses: home-assistant/builder@2026.02.1
        with:
          args: |
            --${{ matrix.arch }} \
            --target ${{ env.ADDON_TARGET }} \
            --version "${{ steps.version.outputs.version }}" \
            ${{ github.event_name == 'pull_request' && '--test' || '--no-cache' }}
